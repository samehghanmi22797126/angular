<!-- 🔵 Bouton flottant -->
<div class="chat-toggle" (click)="toggleChat()">
  💬
  <span *ngIf="unreadCount > 0" class="notification-badge">
    {{ unreadCount }}
  </span>
</div>

<!-- 💬 Chatbox -->
<div class="chatbot-container" [class.active]="chatOpen">

  <!-- Header -->
  <div class="chatbot-header">
    <div style="display: flex; align-items: center;">
      <span class="header-status"></span>
      <h3>CoachBot - Apex</h3>
    </div>
    <button (click)="toggleChat()" style="background:none; border:none; color:white; cursor:pointer; font-size: 20px;">✕</button>
  </div>

  <!-- Messages -->
  <div class="chatbot-messages" #messageContainer>

    <div *ngFor="let msg of messages"
         [ngClass]="{'message': true, 'user': !msg.fromBot, 'bot': msg.fromBot}">

      <div class="message-content">
        <p>{{ msg.text }}</p>
        <small>{{ msg.timestamp | date:'HH:mm' }}</small>
      </div>
    </div>

    <!-- Typing -->
    <div *ngIf="isLoading" class="message bot">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>

  </div>

  <!-- Input -->
  <div class="chatbot-input">
    <input [(ngModel)]="newMessage"
           (keyup.enter)="sendMessage()"
           placeholder="Écrire..." />
    <button (click)="sendMessage()">➤</button>
  </div>

</div>
