<div class="forgot-wrapper">
  <div class="background-overlay"></div>
  
  <div class="forgot-container">
    <div class="forgot-card animate-fade-in">
      <div class="brand-section">
        <div class="logo">
          <!-- Logo Apex -->
          <img src="assets/img/logo.png" alt="Apex Performance Logo" *ngIf="false" /> <!-- Placeholder logic if needed -->
          <div class="logo-fallback">A</div>
        </div>
        <h1 class="brand-title">APEX <span>PERFORMANCE</span></h1>
        <p class="brand-subtitle">RÉCUPÉRATION DE COMPTE</p>
      </div>

      <div class="form-section">
        <h2 class="form-title">Mot de passe oublié ?</h2>
        <p class="form-subtitle">Pas d'inquiétude, nous allons vous renvoyer un lien de réinitialisation.</p>

        <form (ngSubmit)="onSubmit()" #forgotForm="ngForm">
          <div class="input-group">
            <label for="email">VOTRE EMAIL</label>
            <div class="input-container">
              <span class="input-icon">✉️</span>
              <input type="email"
                     id="email"
                     name="email"
                     [(ngModel)]="email"
                     required
                     placeholder="Entrez votre adresse email"
                     class="form-input" />
            </div>
          </div>

          <div class="alerts" *ngIf="error || message">
            <div *ngIf="error" class="alert-message error">{{ error }}</div>
            <div *ngIf="message" class="alert-message success">{{ message }}</div>
          </div>

          <button type="submit" class="btn-submit" [disabled]="loading">
            <span *ngIf="!loading">ENVOYER LE LIEN</span>
            <span *ngIf="loading" class="spinner-inline">Traitement...</span>
          </button>
        </form>

        <div class="back-link">
          <a routerLink="/login">← Retour à la connexion</a>
        </div>
      </div>
    </div>
  </div>
</div>
