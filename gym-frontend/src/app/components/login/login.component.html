<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      <div class="brand-section">
        <div class="logo">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <h1 class="brand-title">Gym<span>Sport</span></h1>
        <p class="brand-subtitle">Gestion de salle de sport professionnelle</p>
      </div>

      <div class="form-section">
        <h2 class="form-title">Connexion</h2>
        <p class="form-subtitle">Accédez à votre espace personnel</p>

        <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
          <div class="input-group">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4 4H20C21.1 4 22 4.9 22 6V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6C2 4.9 2.9 4 4 4Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M22 6L12 13L2 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <input type="email"
                   class="form-input"
                   id="email"
                   name="email"
                   [(ngModel)]="email"
                   required
                   placeholder="Adresse email">
          </div>

          <div class="input-group">
            <div class="input-icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18 8H6C4.9 8 4 8.9 4 10V18C4 19.1 4.9 20 6 20H18C19.1 20 20 19.1 20 18V10C20 8.9 19.1 8 18 8Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path d="M16 8V6C16 4.9 15.1 4 14 4H10C8.9 4 8 4.9 8 6V8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <circle cx="12" cy="14" r="2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </div>
            <input type="password"
                   class="form-input"
                   id="password"
                   name="password"
                   [(ngModel)]="password"
                   required
                   placeholder="Mot de passe">
          </div>

          <div *ngIf="errorMessage" class="alert-message" [class.alert-error]="isError">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="1.5" />
              <path d="M12 8V12M12 16H12.01" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            {{ errorMessage }}
          </div>

          <button type="submit" class="btn-login" [disabled]="loading">
            <span *ngIf="!loading">Se connecter</span>
            <span *ngIf="loading" class="loading-spinner">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" stroke-dasharray="31.4 31.4" stroke-linecap="round" />
              </svg>
              Connexion...
            </span>
          </button>
        </form>

        <div class="register-link">
          <p>Pas encore de compte ? <a routerLink="/register">Créer un compte</a></p>
          <p class="forgot-link"><a routerLink="/forgot-password">Mot de passe oublié ?</a></p>
        </div>
      </div>
    </div>

    <div class="login-footer">
      <p>&copy; 2026 Apex Performance. Tous droits réservés.</p>
    </div>
  </div>
</div>
