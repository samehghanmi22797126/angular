<div class="form-container">
  <div class="form-header">
    <h3>Mon Profil Administrateur</h3>
  </div>

  <div class="admin-card">
    <div class="profile-header">
      <div class="profile-avatar">{{ admin.name?.charAt(0) || 'A' }}</div>
      <div class="profile-info">
        <h4>{{ admin.name }}</h4>
        <p>{{ admin.email }}</p>
      </div>
    </div>

    <form (ngSubmit)="onSubmit()" #profileForm="ngForm" class="modern-form">
      <div class="form-group">
        <label>Nom Complet</label>
        <input type="text" name="name" [(ngModel)]="admin.name" required class="form-input">
      </div>

      <div class="form-group">
        <label>Adresse Email</label>
        <input type="email" name="email" [(ngModel)]="admin.email" required class="form-input">
      </div>

      <div class="form-group">
        <label>Changer le mot de passe</label>
        <input type="password" name="password" [(ngModel)]="admin.password" placeholder="Laisser vide pour ne pas changer" class="form-input">
        <small class="hint">Ne remplissez ce champ que si vous souhaitez changer votre mot de passe.</small>
      </div>

      <div *ngIf="successMessage" class="alert alert-success">
        {{ successMessage }}
      </div>

      <div class="form-footer">
        <button type="submit" class="btn-primary" [disabled]="!profileForm.form.valid || loading">
          {{ loading ? 'Enregistrement...' : 'Enregistrer les modifications' }}
        </button>
      </div>
    </form>
  </div>
</div>
