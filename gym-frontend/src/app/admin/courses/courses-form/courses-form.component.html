<div class="form-container">
  <div class="form-header">
    <button class="btn-back" routerLink="/admin/courses">← Retour</button>
    <h3>{{ isEdit ? 'Modifier le Cours' : 'Créer un Nouveau Cours' }}</h3>
  </div>

  <div class="admin-card">
    <form (ngSubmit)="onSubmit()" #courseForm="ngForm" class="modern-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Titre du cours</label>
          <input type="text" name="title" [(ngModel)]="course.title" required placeholder="Ex: Yoga Matinal" class="form-input">
        </div>

        <div class="form-group">
          <label>Coach responsable</label>
          <select name="coachId" [(ngModel)]="course.coachId" class="form-input">
            <option [ngValue]="null">Aucun coach</option>
            <option *ngFor="let coach of coaches" [value]="coach.id">
              {{ coach.name }} ({{ coach.specialty }})
            </option>
          </select>
        </div>

        <div class="form-group">
          <label>Date et Heure</label>
          <input type="datetime-local" name="startAt" [(ngModel)]="course.startAt" required class="form-input">
        </div>

        <div class="form-group">
          <label>Durée (minutes)</label>
          <input type="number" name="durationMinutes" [(ngModel)]="course.durationMinutes" required placeholder="60" class="form-input">
        </div>

        <div class="form-group">
          <label>Capacité (Places max)</label>
          <input type="number" name="maxParticipants" [(ngModel)]="course.maxParticipants" required placeholder="10" class="form-input">
        </div>

        <div class="form-group full-width">
          <label>Description du cours</label>
          <textarea name="description" [(ngModel)]="course.description" placeholder="Description des activités du cours..." class="form-input" rows="4"></textarea>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-secondary" routerLink="/admin/courses">Annuler</button>
        <button type="submit" class="btn-primary" [disabled]="!courseForm.form.valid || loading">
          {{ loading ? 'Enregistrement...' : (isEdit ? 'Mettre à jour' : 'Créer le cours') }}
        </button>
      </div>
    </form>
  </div>
</div>
