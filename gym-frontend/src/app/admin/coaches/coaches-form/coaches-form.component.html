<div class="form-container">
  <div class="form-header">
    <button class="btn-back" routerLink="/admin/coaches">← Retour</button>
    <h3>{{ isEdit ? 'Modifier le Coach' : 'Ajouter un Nouveau Coach' }}</h3>
  </div>

  <div class="admin-card">
    <form (ngSubmit)="onSubmit()" #coachForm="ngForm" class="modern-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" name="name" [(ngModel)]="coach.name" required placeholder="Ex: Marc Lavoine" class="form-input">
        </div>

        <div class="form-group">
          <label>Email professionnel</label>
          <input type="email" name="email" [(ngModel)]="coach.email" required placeholder="marc@apexperformance.com" class="form-input">
        </div>

        <div class="form-group">
          <label>Spécialité</label>
          <input type="text" name="specialty" [(ngModel)]="coach.specialty" required placeholder="Ex: Musculation, Yoga, Pilates" class="form-input">
        </div>

        <div class="form-group" *ngIf="!isEdit">
          <label>Mot de passe</label>
          <input type="password" name="password" [(ngModel)]="coach.password" required placeholder="••••••••" class="form-input">
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-secondary" routerLink="/admin/coaches">Annuler</button>
        <button type="submit" class="btn-primary" [disabled]="!coachForm.form.valid || loading">
          {{ loading ? 'Enregistrement...' : (isEdit ? 'Mettre à jour' : 'Créer le coach') }}
        </button>
      </div>
    </form>
  </div>
</div>
