<div class="form-container">
  <div class="form-header">
    <button class="btn-back" routerLink="/admin/members">← Retour</button>
    <h3>{{ isEdit ? 'Modifier le Membre' : 'Ajouter un Nouveau Membre' }}</h3>
  </div>

  <div class="admin-card">
    <form (ngSubmit)="onSubmit()" #memberForm="ngForm" class="modern-form">
      <div class="form-grid">
        <div class="form-group">
          <label>Nom complet</label>
          <input type="text" name="name" [(ngModel)]="member.name" required placeholder="Ex: Jean Dupont" class="form-input">
        </div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" name="email" [(ngModel)]="member.email" required placeholder="jean@example.com" class="form-input">
        </div>

        <div class="form-group">
          <label>Âge</label>
          <input type="number" name="age" [(ngModel)]="member.age" required placeholder="25" class="form-input">
        </div>

        <div class="form-group" *ngIf="!isEdit">
          <label>Mot de passe</label>
          <input type="password" name="password" [(ngModel)]="member.password" required placeholder="••••••••" class="form-input">
        </div>

        <div class="form-group">
          <label>Abonnement</label>
          <select name="subscriptionId" [(ngModel)]="member.subscriptionId" class="form-input">
            <option [ngValue]="null">Aucun abonnement</option>
            <option *ngFor="let sub of subscriptions" [value]="sub.id">
              {{ sub.title }} ({{ sub.price }}€)
            </option>
          </select>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-secondary" routerLink="/admin/members">Annuler</button>
        <button type="submit" class="btn-primary" [disabled]="!memberForm.form.valid || loading">
          {{ loading ? 'Enregistrement...' : (isEdit ? 'Mettre à jour' : 'Créer le membre') }}
        </button>
      </div>
    </form>
  </div>
</div>
