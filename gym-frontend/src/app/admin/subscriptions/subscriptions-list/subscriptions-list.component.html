<div class="header-actions">
  <h3>Gestion des Abonnements</h3>
  <button class="btn-primary" [routerLink]="['add']">+ Créer un abonnement</button>
</div>

<div class="admin-card">
  <div class="table-responsive">
    <table class="modern-table">
      <thead>
        <tr>
          <th>Titre</th>
          <th>Prix</th>
          <th>Durée</th>
          <th>Membres</th>
          <th class="text-right">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngIf="loading">
          <td colspan="5" class="text-center">Chargement en cours...</td>
        </tr>
        <tr *ngIf="!loading && subscriptions.length === 0">
          <td colspan="5" class="text-center">Aucun abonnement défini.</td>
        </tr>
        <tr *ngFor="let sub of subscriptions">
          <td>{{ sub.name }}</td>
          <td>{{ sub.price }} €</td>
          <td>{{ sub.durationInMonths }} Mois</td>
          <td><span class="badge">{{ sub.type || 'Standard' }}</span></td>
          <td class="text-right">
            <div class="action-buttons">
              <button class="btn-icon" [routerLink]="['add']" [queryParams]="{id: sub.id}" title="Modifier">
                ✏️
              </button>
              <button class="btn-icon delete" (click)="deleteSubscription(sub.id)" title="Supprimer">
                🗑️
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
